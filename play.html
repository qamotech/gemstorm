<body>
<canvas id="game"></canvas>
<div id="hint"><b>WASD / arrows</b> move · <b>mouse</b> aim (auto-fire) · <b>Space / Shift</b> dash · <b>Right-click / E</b> rocket · <b>P / Esc</b> pause · touch: dual sticks</div>
<script>
'use strict';
/* ============================================================
   GEMSTORM — NEON ABYSS · WEB EDITION v1.0
   A browser port of the Android game (848-upgrade edition's core):
   turtle heroes with jets, 20 waves, the Abyss Warden, level-up
   drafts, straight-line rockets (v2.6.2 rules), harder defaults —
   manual aim, hard mode ON (v2.7.0 rules). Zero dependencies.
   ============================================================ */
const cv = document.getElementById('game'), ctx = cv.getContext('2d', { alpha: false, desynchronized: true });
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(matchMedia('(pointer: coarse)').matches ? 1.5 : 2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const hyp = Math.hypot, atan2 = Math.atan2, cos = Math.cos, sin = Math.sin;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const fmtT = s => `${(s / 60) | 0}:${('' + ((s | 0) % 60)).padStart(2, '0')}`;
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = clamp((n & 255) * f, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
};

/* ---------------- save (localStorage) ---------------- */
const SKEY = 'gemstorm_web_save_v1';
let save = { bank: 0, best: 0, bestWave: 0, victories: 0, kills: 0,
  unlocks: 1, hero: 0, weapon: 0, wunlocks: 1, hard: true, mute: false, shake: true, fx: true, bestCombo: 0 };
try { const s = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) { /* fresh save */ }
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) { /* private mode */ } }

/* ---------------- data ---------------- */
const HEROES = [
  { name: 'Guardian',    col: '#22d3ee', hp: 120, spd: 1.00, cost: 0,    desc: 'Balanced shell, steady jets' },
  { name: 'Swift',       col: '#facc15', hp: 100, spd: 1.18, cost: 400,  desc: 'Fastest jets in the Abyss' },
  { name: 'Bulwark',     col: '#fb923c', hp: 170, spd: 0.92, cost: 900,  desc: 'A tank with a turtle heart' },
  { name: 'Pyro',        col: '#f87171', hp: 110, spd: 1.02, cost: 1200, desc: '+25% damage, burns bright' },
  { name: 'Cryo',        col: '#a5f3fc', hp: 110, spd: 1.02, cost: 1200, desc: 'Chill aura slows nearby foes' },
  { name: 'Turbo',        col: '#22c55e', hp: 130, spd: 1.05, cost: 0,   desc: 'Jet-powered legend of the Abyss. Free.' },
];
const WEAPONS = [
  { name: 'Gem Blaster', dmg: 12, rate: 5.0, spd: 560, cost: 0,    desc: 'The classic' },
  { name: 'Tri-Blaster', dmg: 9,  rate: 5.0, spd: 560, cost: 600,  desc: 'Three-way spread', spread: 3 },
  { name: 'Frost Lance', dmg: 11, rate: 4.2, spd: 620, cost: 900,  desc: 'Chills foes on hit', chill: 0.35 },
  { name: 'Meteor Rod',  dmg: 16, rate: 3.4, spd: 520, cost: 1500, desc: 'Every shot explodes (small AoE)', aoe: 46 },
];
const UPGRADES = [
  { id: 'dmg',    icon: '💥', name: 'Damage +18%',        max: 99, f: () => P.dmgMul *= 1.18 },
  { id: 'rate',   icon: '🔥', name: 'Fire Rate +15%',     max: 99, f: () => P.rateMul *= 1.15 },
  { id: 'spd',    icon: '👟', name: 'Speed +10%',         max: 99, f: () => P.speedMul *= 1.10 },
  { id: 'hp',     icon: '❤️', name: 'Max HP +20 & heal',  max: 99, f: () => { P.maxHp += 20; heal(20); } },
  { id: 'mag',    icon: '🧲', name: 'Magnet +35%',        max: 99, f: () => P.magnetR *= 1.35 },
  { id: 'crit',   icon: '🎯', name: 'Crit Chance +8%',    max: 99, f: () => P.critCh += 0.08 },
  { id: 'critd',  icon: '💢', name: 'Crit Damage +40%',   max: 99, f: () => P.critMul += 0.4 },
  { id: 'proj',   icon: '✨', name: '+1 Projectile',      max: 3,  f: () => { P.projBonus += 1; P.dmgMul *= 0.92; } },
  { id: 'dash',   icon: '💨', name: '+1 Dash Charge',     max: 2,  f: () => { P.dashMax += 1; P.dashCh = P.dashMax; } },
  { id: 'rocket', icon: '🚀', name: '+1 Rocket Charge',   max: 3,  f: () => { P.rocketMax += 1; P.rocketCh = P.rocketMax; } },
  { id: 'regen',  icon: '🌿', name: 'Regen +0.8 HP/s',    max: 99, f: () => P.regen += 0.8 },
  { id: 'armor',  icon: '🛡️', name: 'Armor +2',          max: 99, f: () => P.armor += 2 },
  { id: 'vamp',   icon: '🩸', name: 'Lifesteal +3%',      max: 99, f: () => P.lifesteal += 0.03 },
  { id: 'greed',  icon: '💚', name: 'XP Greed +25%',      max: 99, f: () => P.xpGreed += 0.25 },
  { id: 'heal',   icon: '💖', name: 'Patch Up +40 HP',    max: 99, f: () => heal(40) },
];

/* ---------------- audio (WebAudio synth, no samples) ---------------- */
let AC = null, master = null, musicGain = null, musicTimer = 0, musicStep = 0;
let echoIn = null, padFilter = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = save.mute ? 0 : 0.5;
    // master-bus compressor: glues the mix, stops the drums clipping (v1.4)
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 5;
    comp.attack.value = 0.004; comp.release.value = 0.18;
    master.connect(comp); comp.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.22; musicGain.connect(master);
    // feedback echo send: lead + arp route here for dry + delayed signal (v1.4)
    echoIn = AC.createGain(); echoIn.connect(musicGain);
    const dly = AC.createDelay(1); dly.delayTime.value = 0.29;
    const df = AC.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 2400;
    const fb = AC.createGain(); fb.gain.value = 0.34;
    const wet = AC.createGain(); wet.gain.value = 0.35;
    echoIn.connect(dly); dly.connect(df); df.connect(fb); fb.connect(dly);
    df.connect(wet); wet.connect(musicGain);
    // warm pad bus through a dark lowpass (v1.4)
    padFilter = AC.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.frequency.value = 750;
    padFilter.connect(musicGain);
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, slideTo, dest) {
  if (!AC || save.mute) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, freq, dest) {
  if (!AC || save.mute) return;
  const t = AC.currentTime, len = Math.max(1, (AC.sampleRate * dur) | 0);
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(dest || master); src.start(t);
}
const sfx = {
  shoot() { tone(rnd(620, 700), 0.07, 'square', 0.05, 240); },
  hit() { tone(rnd(180, 240), 0.05, 'sawtooth', 0.04, 90); },
  boom() { noiseBurst(0.35, 0.5, 900); tone(120, 0.35, 'sine', 0.5, 34); },
  rocket() { noiseBurst(0.3, 0.25, 2400); tone(220, 0.3, 'sawtooth', 0.12, 660); },
  dash() { noiseBurst(0.14, 0.16, 3000); },
  gem() { const m = 1 + Math.min(gemStreak, 14) * 0.045; tone(rnd(1180, 1320) * m, 0.09, 'sine', 0.07, 1760 * m); },
  levelup() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'triangle', 0.16), i * 70)); },
  hurt() { tone(140, 0.15, 'sawtooth', 0.2, 60); },
  heart() { [660, 880].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'sine', 0.15), i * 80)); },
  click() { tone(840, 0.05, 'sine', 0.08); },
  draft() { tone(392, 0.2, 'triangle', 0.12, 784); },
};
/* ---- v1.4 music engine: 4-bar loop (Am–F–C–G), 32 steps, layered ----
   1) chord progression instead of a static loop  2) lead melody (pentatonic, detuned, echoed)
   3) real drum kit (kick/snare/hats)              4) feedback echo send
   5) master compressor glue                       6) chord-tone arpeggio layer
   7) adaptive intensity (boss tempo+growl, low-HP heartbeat, ambient menu mode)
   8) warm detuned pad chords under everything                                */
const CHORDS = [
  { root: 110.00, tones: [220.00, 261.63, 329.63] }, // Am
  { root: 87.31,  tones: [174.61, 220.00, 261.63] }, // F
  { root: 130.81, tones: [261.63, 329.63, 392.00] }, // C
  { root: 98.00,  tones: [196.00, 246.94, 293.66] }, // G
];
const LEAD = [
  440, 0, 0, 523.25, 0, 0, 659.25, 0,
  349.23, 0, 0, 440, 0, 523.25, 0, 0,
  523.25, 0, 659.25, 0, 783.99, 0, 659.25, 0,
  587.33, 0, 493.88, 0, 392, 0, 0, 0,
];
const ARP_SEQ = [0, 1, 2, 1, 0, 2, 1, 2];
function kickDrum(vol) { tone(120, 0.16, 'sine', vol, 38, musicGain); }
function snareDrum() { noiseBurst(0.09, 0.15, 1800, musicGain); tone(190, 0.07, 'triangle', 0.09, 120, musicGain); }
function hatDrum(open) { noiseBurst(open ? 0.14 : 0.04, open ? 0.06 : 0.045, 8000, musicGain); }
function padChord(tonesArr, dur, vol) {
  if (!padFilter) return;
  for (const f of tonesArr) {
    tone(f, dur, 'triangle', vol, null, padFilter);
    tone(f * 1.005, dur, 'sine', vol * 0.6, null, padFilter); // detuned chorus shadow
  }
}
function musicTick(dt, boss) {
  if (!AC || save.mute) return;
  musicTimer -= dt;
  if (musicTimer > 0) return;
  const stepDur = boss ? 0.172 : 0.21;
  musicTimer = stepDur;
  const s = musicStep++ % 32, bar = (s / 8) | 0, st = s % 8, ch = CHORDS[bar];
  const inGame = state === 'play';
  const lowHp = inGame && P && P.hp < P.maxHp * 0.3;
  // pad: whole-bar chords — the bed in every mode
  if (st === 0) padChord(ch.tones, stepDur * 8.4, inGame ? 0.028 : 0.05);
  // lead melody through the echo — plays in menu and in game
  const lf = LEAD[s];
  if (lf) {
    tone(lf, stepDur * 1.8, 'triangle', inGame ? 0.07 : 0.09, null, echoIn);
    tone(lf * 1.004, stepDur * 1.8, 'sine', 0.035, null, echoIn);
  }
  if (!inGame) return; // ambient mode: pad + lead only
  // bass: driving 8ths with an octave pop; double-time on boss
  if (st % 2 === 0 || boss) tone(ch.root, stepDur * 0.92, 'triangle', 0.42, null, musicGain);
  if (st === 7) tone(ch.root * 2, stepDur * 0.8, 'triangle', 0.3, null, musicGain);
  // drums
  if (st === 0 || st === 4) kickDrum(0.5);
  if (lowHp && st === 1) kickDrum(0.32); // heartbeat lub-dub when you're dying
  if (st === 2 || st === 6) snareDrum();
  if (st % 2 === 1) hatDrum(st === 7);
  if (boss && st === 3) kickDrum(0.3);
  // arpeggio shimmer through the echo
  tone(ch.tones[ARP_SEQ[st]] * 2, stepDur * 0.9, 'triangle', 0.04, null, echoIn);
  // boss growl at the top of bars 1 and 3
  if (boss && st === 0 && bar % 2 === 0) tone(55, 0.5, 'sawtooth', 0.2, 41, musicGain);
}

/* ---------------- input ---------------- */
const keys = {};
let mouseX = innerWidth / 2, mouseY = innerHeight / 3, mouseDown = false;
const joy = { on: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };   // move stick (touch)
const aim = { on: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };   // aim stick (touch)
let touchMode = false;
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase()) || e.key === ' ') e.preventDefault();
  audioInit();
  if (state === 'play') {
    if (e.key === ' ' || e.key === 'Shift') doDash();
    if (e.key.toLowerCase() === 'e') doRocket();
    if (e.key.toLowerCase() === 'p' || e.key === 'Escape') pauseGame();
  } else if (state === 'pause' && (e.key.toLowerCase() === 'p' || e.key === 'Escape')) resumeGame();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
cv.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
cv.addEventListener('mousedown', e => {
  audioInit();
  if (e.button === 0) { mouseDown = true; handleClick(e.clientX, e.clientY); }
  if (e.button === 2 && state === 'play') doRocket();
});
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => {
  audioInit(); touchMode = true;
  for (const t of e.changedTouches) {
    if (state !== 'play') { handleClick(t.clientX, t.clientY); continue; }
    const stick = t.clientX < W / 2 ? joy : aim;
    if (!stick.on) { stick.on = true; stick.id = t.identifier; stick.ox = t.clientX; stick.oy = t.clientY; stick.dx = 0; stick.dy = 0; }
  }
  e.preventDefault();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    for (const stick of [joy, aim]) {
      if (stick.on && stick.id === t.identifier) {
        let dx = t.clientX - stick.ox, dy = t.clientY - stick.oy;
        const d = hyp(dx, dy), max = 60;
        if (d > max) { dx = dx / d * max; dy = dy / d * max; }
        stick.dx = dx / max; stick.dy = dy / max;
      }
    }
  }
  e.preventDefault();
}, { passive: false });
function endTouch(e) {
  for (const t of e.changedTouches) for (const stick of [joy, aim])
    if (stick.on && stick.id === t.identifier) { stick.on = false; stick.dx = 0; stick.dy = 0; }
}
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);

/* ---------------- game state ---------------- */
let state = 'menu'; // menu | play | draft | pause | over | win
let time = 0, lastTs = 0;
let enemies = [], projs = [], gems = [], parts = [], texts = [], rings = [], pools = [], hearts = [], ghosts = [];
let P = null, wave = 0, score = 0, kills = 0, gemsRun = 0, runTime = 0;
let spawnLeft = 0, spawnTimer = 0, waveState = 'intro', waveT = 0, bossRef = null, bossWave = false, bossSpawned = false, gemsBanked = false;
let endT = -9, pauseT = -9; // click-guard timestamps for end / pause screens
let shake = 0, hitstop = 0, draftChoices = [], endless = false, victoryBanked = false;
let telegraphs = [], confetti = [], banner = null, bannerT = 0, scoreShown = 0, killPopT = 0, xpPulseT = 0,
  draftT = -9, newBest = false, dmgDir = null, gemStreak = 0, gemStreakT = 0, waveTotal = 1, frameN = 0,
  fxScale = 1, dtEma = 0.016;
const MAX_WAVE = 20;

function newPlayer() {
  const hero = HEROES[save.hero], wp = WEAPONS[save.weapon];
  return {
    x: W / 2, y: H / 2, vx: 0, vy: 0, r: 17, face: -Math.PI / 2, aim: -Math.PI / 2,
    hp: hero.hp, maxHp: hero.hp, hero: save.hero, col: hero.col,
    dmgMul: save.hero === 3 ? 1.25 : 1, rateMul: 1, speedMul: hero.spd, magnetR: 110,
    critCh: 0.05, critMul: 2.0, regen: 0, armor: 0, lifesteal: 0, xpGreed: 0, projBonus: 0,
    level: 1, xp: 0, xpNext: 21, // v2.6.2 curve: first level at 21
    fireT: 0, wp,
    dashCh: 2, dashMax: 2, dashCd: 0, dashT: 0,
    rocketCh: 3, rocketMax: 3, rocketCd: 0,
    combo: 0, comboT: 0, comboBest: 0, hurtT: 0, protT: 0, hpGhost: hero.hp, ghostT: 0, kx: 0, ky: 0,
    stacks: {},
  };
}
function startRun() {
  P = newPlayer(); P.protT = 1.5; // spawn protection (A17)
  enemies = []; projs = []; gems = []; parts = []; texts = []; rings = []; pools = []; hearts = []; telegraphs = []; confetti = [];
  scoreShown = 0; newBest = false;
  wave = 0; score = 0; kills = 0; gemsRun = 0; runTime = 0; endless = false; victoryBanked = false; gemsBanked = false;
  state = 'play'; nextWave();
}
function nextWave() {
  wave++; waveState = 'intro'; waveT = 2.0; bossRef = null; bossSpawned = false;
  bossWave = wave % 5 === 0;
  spawnLeft = bossWave ? 9 : (wave === 1 ? 6 : Math.min(6 + wave * 2, 46)); // wave 1 opens gentle (A18)
  waveTotal = spawnLeft;
  spawnTimer = 0.5;
  banner = bossWave ? `⚠ WAVE ${wave} — ABYSS WARDEN ⚠` : `WAVE ${wave}`; bannerT = 1.6; // scaling banner (B10)
}
function spawnEnemy() {
  // foes flash in at the arena edge (a telegraph ring) before they can move or hurt you (A19)
  const edge = (Math.random() * 4) | 0;
  let x, y; const m = 26;
  if (edge === 0) { x = rnd(30, W - 30); y = m; } else if (edge === 1) { x = W - m; y = rnd(30, H - 30); }
  else if (edge === 2) { x = rnd(30, W - 30); y = H - m; } else { x = m; y = rnd(30, H - 30); }
  let type = 'chaser';
  const roll = Math.random();
  if (bossWave && !bossSpawned) { type = 'boss'; bossSpawned = true; }
  else if (wave >= 2 && roll < 0.16) type = 'dart';
  else if (wave >= 3 && roll < 0.30) type = 'brute';
  else if (wave >= 4 && roll < 0.42) type = 'splitter';
  const base = { chaser: { hp: 22, spd: 92, r: 14, dmg: 10, xp: 1, score: 50, col: '#38bdf8' },
    dart: { hp: 14, spd: 168, r: 11, dmg: 8, xp: 1, score: 70, col: '#f472b6' },
    brute: { hp: 95, spd: 52, r: 24, dmg: 18, xp: 3, score: 120, col: '#fb923c' },
    splitter: { hp: 40, spd: 74, r: 17, dmg: 10, xp: 2, score: 90, col: '#4ade80' },
    mini: { hp: 10, spd: 128, r: 9, dmg: 6, xp: 1, score: 30, col: '#86efac' },
    boss: { hp: 1500, spd: 40, r: 46, dmg: 24, xp: 40, score: 3000, col: '#e879f9' } }[type];
  const elite = type !== 'boss' && wave >= 3 && Math.random() < 0.08;
  const dur = type === 'boss' ? 0.9 : 0.45;
  telegraphs.push({ x, y, t: dur, max: dur, boss: type === 'boss', spec: { type, base, elite, col: base.col } });
}
function materialize(tg) {
  const { type, base, elite } = tg.spec;
  const hpMul = (1 + (wave - 1) * 0.24) * (save.hard ? 1.3 : 1);
  const e = { x: tg.x, y: tg.y, type, ...base, hp: base.hp * hpMul * (elite ? 3 : 1), maxHp: base.hp * hpMul * (elite ? 3 : 1),
    elite, wob: rnd(0, TAU), chill: 0, burst66: false, burst33: false, miniT: 3, kx: 0, ky: 0, spawnT: 0.35, ramT: 0, hitCd: 0 };
  if (elite) { e.xp *= 3; e.score *= 3; }
  enemies.push(e);
  if (type === 'boss') { bossRef = e; sfx.boom(); }
}

function addText(x, y, str, col, size, life) { texts.push({ x, y, str, col, size: size || 14, life: life || 0.9, max: life || 0.9 }); if (texts.length > 40) texts.shift(); }
function burst(x, y, col, n, spd) {
  n = Math.max(1, Math.round(n * fxScale * (save.fx ? 1 : 0.35))); // adaptive + Effects toggle
  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(spd * 0.3, spd); parts.push({ x, y, vx: cos(a) * s, vy: sin(a) * s, life: rnd(0.25, 0.6), max: 0.6, col, r: rnd(1.5, 3.2) }); }
  if (parts.length > 420) parts.splice(0, parts.length - 420);
}
function heal(v) { if (P) P.hp = Math.min(P.maxHp, P.hp + v); }
function gainXp(v) {
  P.xp += Math.round(v * (1 + P.xpGreed));

/* ---------------- main loop (with the v2.7 frame safety net) ---------------- */
function loop(ts) {
  const dt = clamp((ts - lastTs) / 1000 || 0.016, 0.001, 0.033);
  lastTs = ts;
  try { update(dt); } catch (e) { console.error('frame skipped', e); }
  try { draw(); } catch (e) { console.error('draw skipped', e); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const HINTS = [

  '💡 Rockets blow up on the board edge too — bank shots count',
  '💡 Red hearts are rare — but a boss always drops one',

setInterval(() => { hintI = (hintI + 1) % HINTS.length; const el = document.getElementById('hint'); if (el) el.innerHTML = HINTS[hintI]; }, 7000);

  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

}
addEventListener('keydown', e => {

    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 3 && draftChoices[n - 1]) applyUpgrade(draftChoices[n - 1]);

  if (e.key.toLowerCase() === 'm') { save.mute = !save.mute; if (master) master.gain.value = save.mute ? 0 : 0.5; persist(); }
  if (e.key.toLowerCase() === 'f') toggleFullscreen();
});
